<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f6" />
    <title>ClearDay Reminder Calendar</title>
    <link rel="stylesheet" href="styles.css?v=2" />
    <link rel="stylesheet" href="calendar.css?v=2" />
    <link rel="stylesheet" href="components.css?v=2" />
    <link rel="stylesheet" href="responsive.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Application header">
        <div class="brand-block">
          <p class="eyebrow">Reminder calendar</p>
          <h1>ClearDay</h1>
          <p id="syncStatus" class="sync-status">Connecting</p>
        </div>

        <nav class="view-tabs" aria-label="ClearDay views">
          <a class="view-tab" href="#calendar" data-page-link="calendar" aria-current="page">Calendar</a>
          <a class="view-tab" href="#events" data-page-link="events">Events</a>
        </nav>

        <div class="topbar-actions">
          <div class="month-actions" aria-label="Calendar navigation" data-month-actions>
            <button class="icon-button" type="button" id="prevMonth" aria-label="Previous month" title="Previous month">&lsaquo;</button>
            <button class="text-button" type="button" id="todayButton">Today</button>
            <button class="icon-button" type="button" id="nextMonth" aria-label="Next month" title="Next month">&rsaquo;</button>
          </div>
          <button class="primary-button topbar-add" id="addReminder" type="button">Add reminder</button>
        </div>
      </header>

      <main class="app-main">
        <section id="calendarPage" class="page-view is-active" data-page="calendar" aria-label="Calendar page">
          <section id="monthView" class="calendar-surface" aria-labelledby="monthTitle">
            <div class="calendar-heading">
              <div>
                <h2 id="monthTitle">Month</h2>
                <p id="monthSummary" class="muted">Loading calendar</p>
              </div>
              <div class="legend" aria-label="Reminder categories">
                <span><i class="dot subscription"></i>Subscription</span>
                <span><i class="dot event"></i>Event</span>
                <span><i class="dot payment"></i>Payment</span>
                <span><i class="dot personal"></i>Personal</span>
              </div>
            </div>

            <div class="weekdays" aria-hidden="true">
              <span>Sun</span>
              <span>Mon</span>
              <span>Tue</span>
              <span>Wed</span>
              <span>Thu</span>
              <span>Fri</span>
              <span>Sat</span>
            </div>
            <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Monthly reminder calendar"></div>
          </section>

          <section id="dayView" class="calendar-surface day-view" aria-labelledby="selectedTitle" hidden>
            <div class="day-toolbar">
              <button class="back-button" id="backToMonth" type="button"><span aria-hidden="true">&larr;</span> Month</button>
              <div class="day-heading">
                <p class="eyebrow">Day schedule</p>
                <h2 id="selectedTitle">Selected day</h2>
                <p id="selectedCount" class="muted">0 reminders</p>
              </div>
              <div class="day-actions" aria-label="Day navigation">
                <button class="icon-button" id="prevDay" type="button" aria-label="Previous day" title="Previous day">&lsaquo;</button>
                <button class="text-button" id="dayTodayButton" type="button">Today</button>
                <button class="icon-button" id="nextDay" type="button" aria-label="Next day" title="Next day">&rsaquo;</button>
                <button class="primary-button" id="addDayReminder" type="button">Add reminder</button>
              </div>
            </div>
            <div id="selectedList" class="day-schedule" aria-live="polite"></div>
          </section>
        </section>

        <section id="eventsPage" class="page-view events-page" data-page="events" aria-labelledby="eventsTitle" hidden>
          <div class="events-header">
            <div>
              <p class="eyebrow">Saved reminders</p>
              <h2 id="eventsTitle">Events</h2>
              <p id="eventsSummary" class="muted">Loading events</p>
            </div>
            <button class="primary-button" id="addFromEvents" type="button">Add reminder</button>
          </div>
          <div id="eventsByDate" class="events-by-date" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <dialog id="reminderDialog" class="app-dialog" aria-labelledby="formTitle">
      <form id="reminderForm" class="dialog-card reminder-form" method="dialog" novalidate>
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Calendar reminder</p>
            <h2 id="formTitle">Add reminder</h2>
          </div>
          <button class="dialog-close" id="closeReminderDialog" type="button" aria-label="Close reminder form" title="Close">&times;</button>
        </div>

        <input type="hidden" id="reminderId" />
        <div class="form-grid">
          <div class="full-field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" maxlength="60" placeholder="Spotify, wedding, credit card" required />
          </div>
          <div class="full-field">
            <label for="category">Type</label>
            <select id="category" name="category">
              <option value="subscription">Subscription to cancel</option>
              <option value="event">Important event</option>
              <option value="payment">Payment or card</option>
              <option value="personal">Personal reminder</option>
            </select>
          </div>
          <div class="date-field">
            <label for="date">Reminder date</label>
            <input id="date" name="date" type="date" required />
          </div>
          <div>
            <label for="time">Start</label>
            <input id="time" name="time" type="time" step="300" />
          </div>
          <div>
            <label for="endTime">End</label>
            <input id="endTime" name="endTime" type="time" step="300" />
          </div>
          <div class="quick-row full-field" aria-label="Quick date choices">
            <button class="subtle-button" type="button" data-preset="tomorrow">Tomorrow</button>
            <button class="subtle-button" type="button" data-preset="month">Next month</button>
            <button class="subtle-button" type="button" data-preset="year">One year</button>
          </div>
          <div class="full-field">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3" maxlength="180" placeholder="Cancellation link, venue, or anything you need later"></textarea>
          </div>
        </div>

        <p class="form-error" id="formError" aria-live="polite"></p>
        <div class="dialog-actions">
          <button class="subtle-button" id="cancelReminder" type="button">Cancel</button>
          <button class="primary-button" id="saveButton" type="submit">Save reminder</button>
        </div>
      </form>
    </dialog>

    <dialog id="deleteDialog" class="app-dialog" aria-labelledby="deleteDialogTitle">
      <div class="dialog-card confirm-card">
        <div>
          <p class="eyebrow">Confirm delete</p>
          <h2 id="deleteDialogTitle">Delete reminder?</h2>
          <p id="deleteDialogText" class="muted"></p>
        </div>
        <p class="form-error" id="deleteDialogError" aria-live="polite"></p>
        <div class="dialog-actions">
          <button class="subtle-button" id="cancelDelete" type="button">Cancel</button>
          <button class="danger-button" id="confirmDelete" type="button">Delete</button>
        </div>
      </div>
    </dialog>

    <template id="emptyTemplate">
      <div class="empty-state">
        <strong>No reminders here</strong>
        <span>This day is free.</span>
      </div>
    </template>

    <script src="config.js?v=2" defer></script>
    <script src="dates.js?v=2" defer></script>
    <script src="storage.js?v=2" defer></script>
    <script src="api.js?v=2" defer></script>
    <script src="reminder-model.js?v=2" defer></script>
    <script src="reminder-repository.js?v=2" defer></script>
    <script src="reminder-form.js?v=2" defer></script>
    <script src="calendar-view.js?v=2" defer></script>
    <script src="app.js?v=2" defer></script>
  </body>
</html>
