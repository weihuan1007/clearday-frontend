name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync frontend to S3
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      FRONTEND_API_BASE: ${{ vars.FRONTEND_API_BASE }}
      FRONTEND_API_TOKEN: ${{ secrets.FRONTEND_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS deployment access
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required GitHub variables..."
          if [ -z "${AWS_REGION:-}" ]; then
            echo "::error::Missing GitHub Actions variable: AWS_REGION"
            exit 1
          fi
          if [ -z "${AWS_ROLE_TO_ASSUME:-}" ]; then
            echo "::error::Missing GitHub Actions variable: AWS_ROLE_TO_ASSUME"
            exit 1
          fi
          if [ -z "${AWS_FRONTEND_BUCKET:-}" ]; then
            echo "::error::Missing GitHub Actions variable: AWS_FRONTEND_BUCKET"
            exit 1
          fi

          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_FRONTEND_BUCKET=$AWS_FRONTEND_BUCKET"
          echo "Checking assumed AWS identity..."
          aws sts get-caller-identity

          echo "Checking S3 bucket access..."
          aws s3api list-objects-v2 \
            --bucket "$AWS_FRONTEND_BUCKET" \
            --max-items 1 >/dev/null || {
              echo "::error::The assumed AWS role cannot list s3://$AWS_FRONTEND_BUCKET. Check the permission policy attached to AWS_ROLE_TO_ASSUME."
              exit 1
            }

      - name: Write frontend runtime config
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="${FRONTEND_API_BASE:-/api}"
          API_TOKEN="${FRONTEND_API_TOKEN:-}"
          export API_BASE
          export API_TOKEN
          node -e "const fs=require('fs'); const apiBase=process.env.API_BASE; const apiToken=process.env.API_TOKEN; const config={ apiBase }; if (apiToken) config.apiToken=apiToken; fs.writeFileSync('config.js', 'window.CLEARDAY_CONFIG = ' + JSON.stringify(config, null, 2) + ';\\n');"
          node --check config.js

      - name: Upload cacheable assets to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync . "s3://$AWS_FRONTEND_BUCKET" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "index.html" \
            --exclude "config.js" \
            --exclude "config.example.js" \
            --cache-control "no-cache"

      - name: Upload HTML and runtime config to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp index.html "s3://$AWS_FRONTEND_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp config.js "s3://$AWS_FRONTEND_BUCKET/config.js" \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/config.js" "/dates.js" "/storage.js" "/api.js" "/reminder-model.js" "/reminder-repository.js" "/reminder-form.js" "/calendar-view.js" "/app.js" "/styles.css" "/calendar.css" "/components.css" "/responsive.css"
