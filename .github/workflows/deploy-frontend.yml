name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync frontend to S3
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      FRONTEND_API_BASE: ${{ vars.FRONTEND_API_BASE }}
      COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      COGNITO_REDIRECT_URI: ${{ vars.COGNITO_REDIRECT_URI }}
      COGNITO_LOGOUT_URI: ${{ vars.COGNITO_LOGOUT_URI }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS deployment access
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required GitHub variables..."
          if [ -z "${AWS_REGION:-}" ]; then
            echo "::error::Missing GitHub Actions variable: AWS_REGION"
            exit 1
          fi
          if [ -z "${AWS_ROLE_TO_ASSUME:-}" ]; then
            echo "::error::Missing GitHub Actions variable: AWS_ROLE_TO_ASSUME"
            exit 1
          fi
          if [ -z "${AWS_FRONTEND_BUCKET:-}" ]; then
            echo "::error::Missing GitHub Actions variable: AWS_FRONTEND_BUCKET"
            exit 1
          fi
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_FRONTEND_BUCKET=$AWS_FRONTEND_BUCKET"
          echo "Checking assumed AWS identity..."
          aws sts get-caller-identity

          echo "Checking S3 bucket access..."
          aws s3api list-objects-v2 \
            --bucket "$AWS_FRONTEND_BUCKET" \
            --max-items 1 >/dev/null || {
              echo "::error::The assumed AWS role cannot list s3://$AWS_FRONTEND_BUCKET. Check the permission policy attached to AWS_ROLE_TO_ASSUME."
              exit 1
            }

      - name: Write frontend runtime config
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="${FRONTEND_API_BASE:-/api}"
          export API_BASE
          export COGNITO_DOMAIN COGNITO_CLIENT_ID COGNITO_REDIRECT_URI COGNITO_LOGOUT_URI
          node <<'NODE'
          const fs = require("node:fs");
          const config = { apiBase: process.env.API_BASE };
          const auth = {
            domain: process.env.COGNITO_DOMAIN,
            clientId: process.env.COGNITO_CLIENT_ID,
            redirectUri: process.env.COGNITO_REDIRECT_URI,
            logoutUri: process.env.COGNITO_LOGOUT_URI,
          };
          const values = Object.values(auth);
          if (values.some(Boolean)) {
            if (!values.every(Boolean)) throw new Error("Set all four Cognito variables when using Cognito.");
            config.auth = auth;
          }
          // Personal Money keys are entered in the browser and never published to S3.
          fs.writeFileSync("config.js", "window.CLEARDAY_CONFIG = " + JSON.stringify(config, null, 2) + ";\n");
          NODE
          node --check config.js

      - name: Upload cacheable assets to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync . "s3://$AWS_FRONTEND_BUCKET" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "index.html" \
            --exclude "config.js" \
            --exclude "config.example.js" \
            --exclude "money-flow-*.json" \
            --exclude "clearday-money-*.json" \
            --cache-control "no-cache"

      - name: Upload HTML and runtime config to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp index.html "s3://$AWS_FRONTEND_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp config.js "s3://$AWS_FRONTEND_BUCKET/config.js" \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/" "/index.html" "/config.js" "/auth.js" "/session-view.js" "/dates.js" "/storage.js" "/api.js" "/reminder-model.js" "/reminder-repository.js" "/reminder-form.js" "/calendar-view.js" "/app.js" "/styles.css" "/calendar.css" "/components.css" "/responsive.css" "/money-model.js" "/money-repository.js" "/money-page.js" "/money.css"
